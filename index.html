<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRENZY | Premium Cakes & Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { frenzy: { light: '#ffcce0', DEFAULT: '#ff8fab', dark: '#fb6f92', text: '#590d22' } },
                    fontFamily: { sans: ['Quicksand', 'sans-serif'], playfair: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body class="font-sans text-gray-700 overflow-x-hidden">

    <div id="welcome-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; background-color: #fff0f5; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease-in-out, visibility 0.8s;">
        
        <div style="position: absolute; top: -10%; left: -10%; width: 400px; height: 400px; background-color: #ffcce0; border-radius: 50%; filter: blur(60px); opacity: 0.7;"></div>
        <div style="position: absolute; bottom: -10%; right: -10%; width: 400px; height: 400px; background-color: #fef08a; border-radius: 50%; filter: blur(60px); opacity: 0.7;"></div>
        
        <div style="position: relative; z-index: 10; text-align: center; padding: 20px;">
            <img src="photo.png" alt="Frenzy Logo" style="width: 150px; margin: 0 auto 30px auto; filter: drop-shadow(0 20px 13px rgba(0, 0, 0, 0.15));">
            <h1 class="font-playfair text-6xl md:text-8xl font-black text-frenzy-text mb-4 tracking-tight">FRENZY</h1>
            <p class="text-xl md:text-2xl text-gray-600 font-medium tracking-widest uppercase mb-12">Artistry in Every Slice</p>
            
            <button onclick="enterSite()" class="px-8 py-4 bg-frenzy-dark text-white font-bold rounded-full shadow-2xl hover:scale-105 transition transform duration-300 flex items-center gap-3 mx-auto">
                Enter The Bakery <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <nav class="fixed w-full z-50 top-0 transition-all duration-300 glass-panel">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
            <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" onclick="window.scrollTo(0,0)">
                <img class="h-14 w-auto object-contain drop-shadow-md" src="photo.png" alt="FRENZY Logo">
                <span class="font-playfair font-black text-3xl text-frenzy-dark tracking-wide hidden sm:block">FRENZY</span>
            </div>
            <div class="hidden md:flex space-x-8 items-center">
                <a href="#custom" class="text-gray-600 hover:text-frenzy-dark font-semibold transition">Configurator</a>
                <a href="#events" class="text-gray-600 hover:text-frenzy-dark font-semibold transition">Events</a>
            </div>
        </div>
    </nav>

    <header class="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 text-center relative z-10">
            <h1 class="font-playfair text-5xl md:text-7xl font-black text-frenzy-text mb-6">Design Your Masterpiece.</h1>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto mb-10 font-medium">Build, rotate, and perfect your custom cake in real-time.</p>
            <a href="#custom" class="px-8 py-4 bg-frenzy-dark text-white rounded-full font-bold shadow-xl hover:bg-frenzy-text transition transform hover:scale-105 inline-block">Start Building</a>
        </div>
    </header>

    <section id="custom" class="py-20">
        <div class="max-w-7xl mx-auto px-4">
            <div class="glass-panel rounded-3xl p-6 md:p-12 shadow-2xl relative overflow-hidden">
                <div class="flex flex-col lg:flex-row gap-10">
                    
                    <div class="w-full lg:w-1/2 relative bg-gradient-to-br from-white to-gray-100 rounded-3xl overflow-hidden border border-white shadow-inner">
                        <div class="absolute top-4 left-4 bg-white/90 px-3 py-1 rounded-full text-xs font-bold text-frenzy-dark z-20 shadow-sm pointer-events-none backdrop-blur-md">
                            <i class="fas fa-hand-pointer mr-1"></i> Drag to rotate
                        </div>
                        <div id="builder-canvas-wrap"></div>
                    </div>

                    <div class="w-full lg:w-1/2 space-y-6 relative z-10 h-[550px] overflow-y-auto pr-2 scroll-hidden">
                        
                        <div>
                            <label class="block text-sm font-bold text-frenzy-text mb-2">1. Base Architecture</label>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="style-btns">
                                <button class="btn-option active px-2 py-2 text-sm" data-style="naked">Naked Sponge</button>
                                <button class="btn-option px-2 py-2 text-sm" data-style="buttercream">Buttercream</button>
                                <button class="btn-option px-2 py-2 text-sm" data-style="fondant">Smooth Fondant</button>
                                <button class="btn-option px-2 py-2 text-sm" data-style="twolayer">2-Layer</button>
                                <button class="btn-option px-2 py-2 text-sm" data-style="wedding">3-Tier</button>
                                <button class="btn-option px-2 py-2 text-sm" data-style="bento">Bento Mini</button>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-frenzy-text mb-2">2. Dimensions</label>
                            <div class="flex flex-wrap gap-2" id="size-btns"></div>
                        </div>

                        <div id="color-section" class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-frenzy-text mb-2">3. Exterior Color</label>
                                <input type="color" id="cake-color-picker" value="#ffcce0">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-frenzy-text mb-2">Inside Flavor</label>
                                <select class="w-full h-12 px-3 rounded-xl border-2 border-frenzy-light bg-white focus:border-frenzy-dark outline-none font-semibold text-gray-700">
                                    <option>Vanilla</option><option>Chocolate</option><option>Caramel</option><option>Red Velvet</option>
                                    <option>Carrot</option><option>Rainbow Velvet</option><option>Lemon Cake</option><option>Black Forest</option>
                                </select>
                            </div>
                        </div>

                        <div class="bg-gradient-to-r from-yellow-50 to-white p-4 rounded-2xl border border-yellow-200">
                            <label class="block text-sm font-bold text-yellow-700 mb-2"><i class="fas fa-sparkles"></i> Real Gold Foil (+P)</label>
                            <select id="foil-select" class="w-full p-3 rounded-xl border-none ring-1 ring-yellow-300 bg-white font-semibold text-gray-700 outline-none">
                                <option value="none" data-price="0">No Foil</option>
                                <option value="top" data-price="40">Top Flakes (+P40)</option>
                                <option value="sides" data-price="50">Side Flakes (+P50)</option>
                                <option value="both" data-price="80">Everywhere (+P80)</option>
                                <option value="cover" data-price="150">Solid Wrap (+P150)</option>
                            </select>
                        </div>

                        <div class="bg-white/80 p-4 rounded-2xl border border-frenzy-light shadow-sm">
                            <label class="block text-sm font-bold text-frenzy-text mb-3">5. Free Embellishments</label>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center gap-2">
                                    <span class="text-sm font-semibold text-gray-600 w-1/3">Sprinkles</span>
                                    <select id="sprinkles-select" class="w-2/3 p-2 rounded-lg border border-gray-200 bg-white text-sm outline-none"><option value="none">None</option><option value="rainbow">Rainbow</option><option value="choc">Chocolate</option><option value="pink">Pink Magic</option></select>
                                </div>
                                <div class="flex justify-between items-center gap-2">
                                    <span class="text-sm font-semibold text-gray-600 w-1/3">Glitter</span>
                                    <select id="glitter-select" class="w-2/3 p-2 rounded-lg border border-gray-200 bg-white text-sm outline-none"><option value="none">None</option><option value="#FFD700">Gold Dust</option><option value="#E0E0E0">Silver Shimmer</option><option value="#FF69B4">Pink Sparkle</option></select>
                                </div>
                                <div class="flex justify-between items-center gap-2">
                                    <span class="text-sm font-semibold text-gray-600 w-1/3">Flowers</span>
                                    <div class="w-2/3 flex gap-2">
                                        <select id="flower-type" class="w-1/2 p-2 rounded-lg border border-gray-200 bg-white text-sm outline-none"><option value="none">None</option><option value="real">Real Roses</option><option value="fake">Sugar Flowers</option></select>
                                        <select id="flower-placement" class="w-1/2 p-2 rounded-lg border border-gray-200 bg-white text-sm outline-none"><option value="top">Top Ring</option><option value="cascade">Diagonal</option></select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-frenzy-text mb-2">6. Top Inscription</label>
                                <input type="text" id="cake-text" maxlength="20" placeholder="e.g. Happy Birthday!" class="w-full p-3 rounded-xl border-none ring-1 ring-gray-200 bg-white focus:ring-2 focus:ring-frenzy outline-none font-semibold">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-frenzy-text mb-2">7. Inspiration Photo</label>
                                <div class="border-2 border-dashed border-frenzy-dark rounded-xl p-3 text-center bg-white/50 cursor-pointer hover:bg-white transition" onclick="document.getElementById('file-upload').click()">
                                    <i class="fas fa-camera text-frenzy-dark mb-1"></i>
                                    <p class="text-xs text-gray-500">Upload Photo</p>
                                    <input type="file" id="file-upload" class="hidden" accept="image/*">
                                </div>
                            </div>
                        </div>

                        <div class="pt-6 border-t border-gray-200 mt-6 flex justify-between items-center">
                            <div>
                                <span class="text-gray-500 font-bold uppercase tracking-wide text-xs">Estimated Price</span>
                                <div id="price-display" class="font-playfair text-3xl font-black text-frenzy-dark">P 300</div>
                            </div>
                            <button class="bg-frenzy-dark text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-frenzy-text transition transform hover:scale-[1.02]">Order Now</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="app.js"></script>

    <script>
        function enterSite() {
            const screen = document.getElementById('welcome-screen');
            screen.style.opacity = '0';
            setTimeout(() => { screen.style.visibility = 'hidden'; }, 800);
        }
    </script>
</body>
</html>

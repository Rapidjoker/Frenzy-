<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRENZY | 3D Cake Studio</title>

<script src="https://cdn.tailwindcss.com"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
body {
  margin:0;
  background:#fff0f5;
  font-family:sans-serif;
}
#canvas-wrap {
  width:100%;
  height:600px;
}
</style>
</head>
<body>

<div class="text-center py-8">
  <img src="photo.png" class="w-28 mx-auto mb-4">
  <h1 class="text-5xl font-bold text-pink-600">FRENZY 3D STUDIO</h1>
  <p class="text-gray-600 mt-2">Luxury Cartoon Cake Builder</p>
</div>

<div id="canvas-wrap"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const wrap = document.getElementById("canvas-wrap");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth/wrap.clientHeight, 0.1, 100);
camera.position.set(0,18,32);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,8,0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const keyLight = new THREE.DirectionalLight(0xffffff,1.3);
keyLight.position.set(15,25,15);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffcce0,0.8,100);
fillLight.position.set(-20,15,20);
scene.add(fillLight);

const plateGeo = new THREE.CylinderGeometry(10,10.2,0.4,64);
const plateMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.2 });
const plate = new THREE.Mesh(plateGeo, plateMat);
plate.receiveShadow = true;
plate.position.y = -0.2;
scene.add(plate);

function createCake(color){
  const group = new THREE.Group();

  const material = new THREE.MeshPhysicalMaterial({
    color: color,
    roughness:0.3,
    metalness:0.05,
    clearcoat:1,
    clearcoatRoughness:0.1,
    sheen:1,
    sheenColor:new THREE.Color(0xffffff)
  });

  const geo = new THREE.CylinderGeometry(8,8,8,128);
  const cake = new THREE.Mesh(geo, material);
  cake.castShadow = true;
  cake.receiveShadow = true;
  cake.position.y = 4;
  group.add(cake);

  return group;
}

let cakeGroup = createCake(0xff8fab);
scene.add(cakeGroup);

window.addEventListener("resize", ()=>{
  camera.aspect = wrap.clientWidth/wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
});

function animate(){
  requestAnimationFrame(animate);
  cakeGroup.rotation.y += 0.003;
  cakeGroup.position.y = Math.sin(Date.now()*0.001)*0.3;
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
